version: '3.8'

services:

postgres:

image: postgres:16-alpine

container\_name: homenet-postgres

restart: unless-stopped

environment:

POSTGRES\_DB: homenet

POSTGRES\_USER: homenet\_user

POSTGRES\_PASSWORD: homenet\_secure\_db\_pass

volumes:

\- homenet\_pgdata:/var/lib/postgresql/data

ports:

\# Expose only to 127.0.0.1 for local host inspection if necessary

\- "127.0.0.1:5433:5432"

networks:

\- homenet-internal

healthcheck:

test: \["CMD-SHELL", "pg\_isready -U homenet\_user -d homenet"\]

interval: 5s

timeout: 5s

retries: 5

api:

build:

context: .

dockerfile: Dockerfile

container\_name: homenet-api

restart: unless-stopped

environment:

NODE\_ENV: production

PORT: 3001

API\_PREFIX: api/v1

DATABASE\_URL: ${DATABASE\_URL:?Set DATABASE\_URL in .env}

FRONTEND\_ORIGIN: ${FRONTEND\_ORIGIN:-https://rad-cucurucho-a9ef22.netlify.app}

JWT\_SECRET: replace\_with\_long\_random\_secret\_in\_production\_32chars

SPEEDTEST\_BIN: speedtest

SPEED\_THRESHOLD\_MBPS: 10

UPLOAD\_THRESHOLD\_MBPS: 10

SPEED\_TEST\_INTERVAL\_MINUTES: 15

ROUTER\_POLL\_INTERVAL\_SECONDS: 60

ROUTER\_ADAPTER: ${ROUTER\_ADAPTER:-unsupported}

ROUTER\_BASE\_URL: http://192.168.1.1

ROUTER\_USERNAME: admin

ROUTER\_PASSWORD: admin

ports:

\- "3001:3001"

extra\_hosts:

\- "host.docker.internal:host-gateway"

networks:

\- homenet-internal

volumes:

homenet\_pgdata:

driver: local

networks:

homenet-internal:

driver: bridge